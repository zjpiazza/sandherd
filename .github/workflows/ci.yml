name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run repository checks
        run: make verify

  binaries:
    name: Linux ${{ matrix.arch }} binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build commands
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/...

  containers:
    name: ${{ matrix.target }} container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - control-plane
          - runner
          - herdr-bridge
          - workspace-bootstrap
          - agent-runtime
          - codex-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 and arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false

  codex-supply-chain:
    name: Codex provenance and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Verify signed Codex release artifacts
        run: ./build/codex/verify-release.sh

      - name: Build Codex runtime
        run: docker build --target codex-runtime --tag sandherd/codex-runtime:scan .

      - name: Scan Codex runtime
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sandherd/codex-runtime:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          version: v0.72.0

  agent-sandbox-router:
    name: Agent Sandbox router container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 and arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/agent-sandbox-router/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

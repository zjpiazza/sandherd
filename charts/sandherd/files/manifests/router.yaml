apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: sandherd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: router
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: router
    app.kubernetes.io/part-of: sandherd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-router
        app.kubernetes.io/component: router
        app.kubernetes.io/part-of: sandherd
    spec:
      serviceAccountName: sandbox-router
      automountServiceAccountToken: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-router
              app.kubernetes.io/component: router
      containers:
        - name: sandbox-router
          image: sandherd/agent-sandbox-router:v0.5.3
          imagePullPolicy: IfNotPresent
          args:
            - --http-bind-address=:8080
            - --metrics-bind-address=:9090
            - --health-probe-bind-address=:8081
            - --cluster-domain=cluster.local
            - --proxy-timeout=180s
            - --upstream-max-retries=3
            - --cache-enabled=false
            - --authz-mode=tokenreview
            - --authz-tokenreview-require-token=true
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      terminationGracePeriodSeconds: 45
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/part-of: sandherd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: router

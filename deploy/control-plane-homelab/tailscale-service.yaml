apiVersion: v1
kind: Service
metadata:
  name: sandherd-control-plane-tailnet
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-control-plane
    app.kubernetes.io/part-of: sandherd
  annotations:
    tailscale.com/hostname: sandherd
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: sandherd-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandherd-control-plane-tailnet
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-control-plane
    app.kubernetes.io/part-of: sandherd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandherd-control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8080

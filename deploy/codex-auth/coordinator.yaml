apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandherd-codex-auth
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-codex-auth
    app.kubernetes.io/part-of: sandherd
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandherd-codex-auth
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-codex-auth
    app.kubernetes.io/part-of: sandherd
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandherd-codex-auth
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-codex-auth
    app.kubernetes.io/part-of: sandherd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandherd-codex-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandherd-codex-auth
        app.kubernetes.io/part-of: sandherd
    spec:
      serviceAccountName: sandherd-codex-auth
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: sandherd/codex-runtime:dev
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/codex-auth]
          args:
            - serve
            - --listen=:8090
            - --auth-file=/var/lib/sandherd/codex/auth.json
            - --codex-binary=/usr/local/bin/codex
            - --refresh-interval=1m
          env:
            - name: HOME
              value: /var/lib/sandherd
            - name: CODEX_HOME
              value: /var/lib/sandherd/codex
          ports:
            - name: credentials
              containerPort: 8090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: credentials
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: credentials
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: credential-state
              mountPath: /var/lib/sandherd/codex
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: credential-state
          persistentVolumeClaim:
            claimName: sandherd-codex-auth
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sandherd-codex-auth
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-codex-auth
    app.kubernetes.io/part-of: sandherd
spec:
  selector:
    app.kubernetes.io/name: sandherd-codex-auth
  ports:
    - name: credentials
      port: 8090
      targetPort: credentials
      protocol: TCP

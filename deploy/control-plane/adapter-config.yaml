apiVersion: v1
kind: ConfigMap
metadata:
  name: sandherd-adapter-config
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-control-plane
    app.kubernetes.io/part-of: sandherd
data:
  adapters.json: |
    {
      "version": 1,
      "adapters": [
        {
          "id": "codex",
          "displayName": "OpenAI Codex",
          "version": "0.146.0",
          "capabilities": ["interactive", "headless", "session-resume", "mcp", "subscription-auth"],
          "profiles": [
            {
              "sandboxProfile": "standard",
              "credentialProfile": "chatgpt-subscription",
              "credentialMode": "mutable",
              "warmPool": "sandherd-codex",
              "command": ["/usr/local/bin/codex-launcher", "-c", "cli_auth_credentials_store=\"file\"", "-c", "forced_login_method=\"chatgpt\"", "--dangerously-bypass-approvals-and-sandbox", "--no-alt-screen"],
              "healthCheck": ["/usr/local/bin/codex", "--version"]
            }
          ]
        },
        {
          "id": "shell",
          "displayName": "Development shell",
          "version": "1",
          "capabilities": ["interactive"],
          "profiles": [
            {
              "sandboxProfile": "standard",
              "credentialMode": "none",
              "warmPool": "sandherd-standard",
              "command": ["/bin/bash", "--noprofile", "--norc"],
              "healthCheck": ["/bin/bash", "--version"]
            }
          ]
        },
        {
          "id": "shell-minimal",
          "displayName": "Development POSIX shell",
          "version": "1",
          "capabilities": ["interactive", "headless"],
          "profiles": [
            {
              "sandboxProfile": "standard",
              "credentialMode": "none",
              "warmPool": "sandherd-standard",
              "command": ["/bin/sh"],
              "healthCheck": ["/bin/sh", "-c", "exit 0"]
            }
          ]
        }
      ]
    }

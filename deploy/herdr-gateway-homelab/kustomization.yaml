apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../herdr-gateway

patches:
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: sandherd-herdr-home
      namespace: sandherd-system
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: rook-ceph-block
  - target:
      version: v1
      kind: Service
      name: sandherd-herdr
      namespace: sandherd-system
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          tailscale.com/hostname: sandherd-herdr
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/loadBalancerClass
        value: tailscale

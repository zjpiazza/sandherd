apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

nameSuffix: -openrouter

images:
  - name: sandherd/agent-runtime
    newName: sandherd/codex-runtime
    newTag: dev

patches:
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxTemplate
      name: sandherd-standard
    patch: |-
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: CODEX_HOME
          value: /home/sandherd/.codex-openrouter
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: sandherd-openrouter
              key: api-key
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxWarmPool
      name: sandherd-standard
    patch: |-
      - op: replace
        path: /spec/sandboxTemplateRef/name
        value: sandherd-standard-openrouter

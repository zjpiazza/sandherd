apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -https-private

patches:
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxTemplate
      name: sandherd-standard
    patch: |-
      - op: add
        path: /spec/podTemplate/spec/initContainers/0/env
        value:
          - name: SANDHERD_GIT_CREDENTIAL_FILE
            value: /var/run/secrets/repository/credential.json
      - op: add
        path: /spec/podTemplate/spec/initContainers/0/volumeMounts/-
        value:
          name: repository-credential
          mountPath: /var/run/secrets/repository
          readOnly: true
      - op: add
        path: /spec/podTemplate/spec/volumes/-
        value:
          name: repository-credential
          secret:
            secretName: sandherd-repository-https-private
            defaultMode: 288
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxWarmPool
      name: sandherd-standard
    patch: |-
      - op: replace
        path: /spec/sandboxTemplateRef/name
        value: sandherd-standard-https-private

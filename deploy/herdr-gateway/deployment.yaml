apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandherd-herdr
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-herdr
    app.kubernetes.io/part-of: sandherd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandherd-herdr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandherd-herdr
        app.kubernetes.io/part-of: sandherd
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: herdr
          image: sandherd/herdr-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/sandherd
            - name: SANDHERD_CONFIG_FILE
              value: /etc/sandherd/config.json
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: home
              # Create a user-owned HOME below the fsGroup-managed PVC root.
              mountPath: /home
            - name: tmp
              mountPath: /tmp
            - name: access
              mountPath: /var/run/secrets/sandherd-herdr
              readOnly: true
            - name: config
              mountPath: /etc/sandherd
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: sandherd-herdr-home
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: access
          secret:
            secretName: sandherd-herdr-access
            defaultMode: 0440
            items:
              - key: authorized_keys
                path: authorized_keys
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
              - key: api-token
                path: api-token
        - name: config
          configMap:
            name: sandherd-herdr-config
            defaultMode: 0444

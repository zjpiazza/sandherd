apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandherd-system

resources:
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - network-policy.yaml

configMapGenerator:
  - name: sandherd-herdr-config
    files:
      - config.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: sandherd-herdr
    app.kubernetes.io/part-of: sandherd

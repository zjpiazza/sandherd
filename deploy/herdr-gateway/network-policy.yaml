apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandherd-herdr
  namespace: sandherd-system
  labels:
    app.kubernetes.io/name: sandherd-herdr
    app.kubernetes.io/part-of: sandherd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandherd-herdr
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 2222
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandherd-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sandherd-control-plane
      ports:
        - protocol: TCP
          port: 8080

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: flux-system
spec:
  interval: 1h
  releaseName: agent-sandbox
  targetNamespace: agent-sandbox-system
  chart:
    spec:
      chart: ./helm
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: agent-sandbox-upstream
        namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
      tag: v0.5.3@sha256:ba381b4e0c86cca597d5c5a31860e38d30ec1c45e0a7a8328bb2799c87d059c0
    controller:
      extensions: true
    podAnnotations:
      sandherd.dev/managed-by: flux
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
